name: Lean build + proof audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check proof sources and source index
        run: |
          python3 scripts/check_integrity.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/generate_index.py --check
      - name: Install Lean for proof-guard tests
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Verify that forbidden proof fixtures fail
        run: python3 scripts/check_axioms_regressions.py
      - name: Build library with cached dependencies
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          mk_all-check: true
      - name: Build verification modules
        run: flock -x /tmp/lean-fp-build.lock -c 'lake build Verification'
      - name: Audit every project declaration (no sorry or extra axioms)
        run: python3 scripts/check_axioms.py
      - name: Replay both libraries with leanchecker
        timeout-minutes: 45
        env:
          # Each check loads a mathlib import environment. Keep peak memory bounded.
          LEAN_NUM_THREADS: "1"
        run: lake env leanchecker -v FreeProbability Verification
